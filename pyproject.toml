[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "harassment_detection"
version = "0.1.0"
description = "A project for detecting cyberbullying and harassment using ML."
requires-python = ">=3.9"
dependencies = [
    "kagglehub"
]

[tool.setuptools.packages.find]
where = ["src"]